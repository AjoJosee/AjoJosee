name: Generate contribution snake

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: AjoJosee
          outputs: |
            assets/github-contribution-grid-snake.svg?palette=github-dark
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a371f7
      - uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update contribution snake"
          default_author: github_actions
